 return `<section class="panel top-actions" aria-label="Top 5 EV actions"><div class="section-title"><div><span class="eyebrow">${h.live&&state.step===h.events.length?'LIVE DECISION':'REPLAY DECISION'}</span><h2>Top 5 EV actions</h2></div><span class="tag">Estimated · ${s.street==='Preflop'?'preflop, up to 6 players':'heads-up postflop'}</span></div>${engineControl(state.config.engine)}${s.street==='Preflop'?preflopOverview(h,s,decision):postflopControls()}<div class="ranking-toolbar"><p class="small-note">${reason?esc(reason):`Hero vs ${decision.preflop?decision.opponents.length+' opponents':esc(decision.villain.name)} · ${s.street} · ${formatStackBB(s.pot,h.bb)} pot. Compare check/call, fold when facing a bet, and legal wager sizes.`}</p><button class="button primary" data-action="rank-actions" ${reason||state.loading?'disabled':''}>${state.loading?(state.rankProgress||'Calculating…'):ranked?'Recalculate top actions':'Compare top actions'}</button></div>${ranked?`<p class="ranking-context">Best ${ranked.actions.length} of ${ranked.tested} tested actions · ${ranked.iterations.toLocaleString()} ${ranked.model==='postflop-range'?'seeded runouts per branch':'shared deals per size'} · raw equity ${pct(ranked.equity)}</p><ol class="ranked-actions">${ranked.actions.map(a=>`<li><details class="ranked-action" ${a.rank===1?'open':''}><summary><span class="rank-number">${a.rank}</span><span class="rank-label"><b>${esc(a.label)}</b><small>${esc(a.detail)}</small></span><span class="rank-ev ${a.ev>=0?'positive':'negative'}"><b>${signed(a.ev)}</b><small>${(a.ev*100/h.bb).toFixed(2)} BB EV</small></span><span class="rank-gap">${a.rank===1?'Best tested':dollar(a.gap)+' below best'}<small>View routes</small></span></summary><div class="rank-routes">${a.mix?`<p class="small-note">${ranked.preflop?'Field response:':'Opponent now:'} ${pct(a.mix.fold)} ${ranked.preflop?'everyone folds':'fold'} · ${pct(a.mix.call)} ${ranked.preflop?'continue without raising':'call'} · ${pct(a.mix.raise)} ${ranked.preflop&&ranked.model==='cash'?'raise (Hero may call)':ranked.preflop?'raise → Hero folds':'raise'}</p>`:''}${responseRangeView(a,a.id)}<div class="ranking-route-head"><span>Route / probability</span><span>Net payoff</span><span>EV contribution</span></div>${a.routes.map(r=>`<div class="ranking-route"><span>${esc(r.name)}<small>${pct(r.p)}</small></span><b>${signed(r.payoff)}</b><b class="${r.contribution>=0?'positive':'negative'}">${signed(r.contribution)}</b></div>`).join('')}<div class="route-total"><span>Probability total ${pct(a.routes.reduce((n,r)=>n+r.p,0))}</span><b>EV ${signed(a.ev)}</b></div></div></details></li>`).join('')}</ol>${ranked.tested<5?'<p class="small-note">Fewer than five distinct legal actions are available. Equivalent sizes are counted once.</p>':''}`:`<p class="ranking-empty">${s.street==='Preflop'?'Compare fold, limp/call/check, 2–4 BB opens, 2.5–4× re-raises, pot-based sizes, custom and effective-stack wagers.':'Compare minimum, ⅓, ½, ¾, pot, 1½-pot, custom and effective-stack wagers.'} Stack limits and duplicate sizes are handled automatically.</p>`}<p class="small-note ranking-scope">Best among tested sizes under your assumptions, not a solved strategy. ${s.street==='Preflop'&&state.config.preflopModel==='cash'?'Cash-baseline responses depend on position, size, pot odds, effective stack and the chosen tendency. These are explicit heuristics, not measured pool frequencies or GTO.':s.street!=='Preflop'&&state.config.postflopModel==='range'?'Fold/call/raise ranges depend on each combination’s equity against the assumed Hero betting range and the price offered.':'Legacy model: fixed bucket responses can distort bet sizing.'} ${s.street==='Preflop'?(state.config.preflopModel==='cash'?'One further preflop raise is modeled, followed by fold/call decisions for Hero and the remaining players. Continuing hands check down; later raises and postflop strategy are omitted.':'Players still owed action may fold, call or raise; then the hand checks down. Hero folds to any raise while holding chips. Once Hero is all-in, others make one call/fold decision with no further side-pot betting.'):state.config.postflopModel==='range'?'One further raise is modeled; Hero may fold or call against the raising range. Then both players check down. Future betting and equity denial from later bets are omitted.':`Calls check down${state.config.futureMin>=0?' unless the selected turn-to-river rule applies':''}; Hero folds to a re-raise.`} EV is net from this decision, after estimated fees; prior contributions are sunk. Small EV gaps may be simulation noise.</p><button class="text-button" data-action="view" data-value="ranges">Edit ranges, response rates, sizes & fees →</button></section>`;

function postflopControls(){return `<div class="postflop-controls"><label>Postflop model<select id="postflop-model"><option value="range" ${state.config.postflopModel==='range'?'selected':''}>Range-conditioned responses</option><option value="manual" ${state.config.postflopModel==='manual'?'selected':''}>Fixed bucket weights (legacy)</option></select></label>${state.config.postflopModel==='range'?`<label>Assumed bluff:value multiplier<select id="postflop-bluffs">${[[0,'0 · no bluffs'],[.25,'0.25 · fewer bluffs'],[.5,'0.5 · default assumption'],[1,'1 · more bluffs']].map(([v,l])=>`<option value="${v}" ${state.config.postflopBluffFactor===v?'selected':''}>${l}</option>`).join('')}${![0,.25,.5,1].includes(state.config.postflopBluffFactor)?`<option selected value="${state.config.postflopBluffFactor}">${state.config.postflopBluffFactor} · imported assumption</option>`:''}</select></label><label class="check-label"><input type="checkbox" id="postflop-mix" ${state.config.postflopUseMix?'checked':''}>Use my edited Hero betting mix</label><p class="small-note">Check/call assumes checkdown. Bet/raise allows one further raise, then checkdown. Opponent bets after your check and future-street betting are omitted. These policies are assumptions. The bluff:value ratio is multiplier × bet / (pot + bet), subject to available combinations.</p>`:'<p class="baseline-disclosure">Legacy weights do not adjust to sizing and can overvalue all-in or minimum bets.</p>'}</div>`;}
function responseRangeView(result,id){
 const info=result.responseRanges;if(!info)return '';
 const faces=cards=>cards.map(c=>c[0]+({s:'♠',h:'♥',d:'♦',c:'♣'}[c[1]])).join(' ');
 return `<details class="response-ranges"><summary>Inspect fold / call / raise ranges</summary><p class="small-note">Equity against the calling range: <b>${info.mix.call?pct(result.calledEquity):'No calls'}</b>. ${info.mix.raise?`Hero calls ${pct(result.heroCallRaise)} of modeled re-raises to ${dollar(result.raiseTo)}.`:''}</p><p class="small-note">Opponent policy uses ${info.bettingRange.source==='edited'?'your edited Hero betting mix':'an automatic size-conditioned Hero betting range'} (${info.bettingRange.combos} legal combinations${info.bettingRange.bluffShare===null?'':'; '+pct(info.bettingRange.bluffShare)+' bluff component'}). Required call equity after estimated fees: ${pct(info.price)}. Policy equity uses 128 samples per hand on flop/turn; exact weighted equity on the river.</p>${Object.entries(info.branches).map(([action,branch])=>`<details class="response-branch"><summary>${action[0].toUpperCase()+action.slice(1)} · ${pct(branch.probability)} · ${branch.rows.length} combinations</summary><p class="small-note">Showing the ${Math.min(20,branch.rows.length)} highest-weight combinations. “Action frequency” is conditional on holding that hand; “Within branch” is its normalized share after this action.</p><div class="response-table-scroll"><table><thead><tr><th>Hand</th><th>Reach</th><th>Action frequency</th><th>Within branch</th></tr></thead><tbody>${branch.rows.slice(0,20).map(p=>`<tr><th>${faces(p.cards)}</th><td>${pct(p.reach)}</td><td>${pct(p.frequency)}</td><td>${pct(p.prob)}</td></tr>`).join('')||'<tr><td colspan="4">No hands take this action under these assumptions.</td></tr>'}</tbody></table></div></details>`).join('')}<button class="text-button" data-action="export-response-ranges" data-value="${esc(id)}">Export every combination and branch probability</button><p class="small-note">P(action) = Σ reach × action frequency. Within branch = reach × action frequency / P(action). EV sums each route’s probability × net payoff.</p></details>`;
}
function preflopOverview(h,s,decision){

 const spot=raises===0?'Unopened / limped pot':raises===1?'Facing an open raise':raises===2?'Facing a 3-bet':'Facing a '+(raises+1)+'-bet';

 return `<div class="preflop-overview"><div><strong>Preflop · ${spot}</strong><span>${decision?esc(decision.hero.position)+' · '+(decision.H*100/h.bb).toFixed(1)+' BB behind':'Move to your preflop decision'}</span></div>${baselineControls(h)}<p class="small-note">Every remaining opponent's edited range is included. Choose a player to inspect or adjust that range.</p><div class="preflop-opponents">${players.map(p=>`<button class="button secondary" data-action="opponent-range" data-value="${esc(p.name)}">${esc(p.name)} · ${esc(p.position)}</button>`).join('')}</div><p class="small-note">Preflop estimate: weighted joint deals, ${state.config.preflopModel==='cash'?'size-dependent responses and one further raise':'manual response weights'}, then showdown with no postflop bets. Future boards and shown cards from the replay are not used.</p></div>`;

function baselineControls(h){return `<div class="baseline-controls"><label>Preflop baseline<select id="preflop-model"><option value="cash" ${state.config.preflopModel==='cash'?'selected':''}>General cash baseline (default)</option><option value="manual" ${state.config.preflopModel==='manual'?'selected':''}>Manual bucket weights (legacy)</option></select></label>${state.config.preflopModel==='cash'?`<label>Opponent tendency<select id="population-tightness"><option value="0" ${state.config.populationTightness===0?'selected':''}>Neutral assumption</option><option value="0.04" ${state.config.populationTightness===.04?'selected':''}>Tighter assumption</option><option value="-0.04" ${state.config.populationTightness===-.04?'selected':''}>Looser assumption</option>${![-.04,0,.04].includes(state.config.populationTightness)?`<option selected value="${state.config.populationTightness}">Custom assumption</option>`:''}</select></label>`:''}</div><p class="baseline-disclosure">${money(h.sb)} / ${money(h.bb)} cash · sizes and stacks measured in BB. <strong>${state.config.preflopModel==='cash'?'General heuristic — no verified population data or GTO solution loaded.':'Legacy model — size-independent calls can make large shoves look too attractive.'}</strong> Stakes alone do not establish how this table plays. Range edits and recorded player memory remain available.</p>`;}
function responsePanel(){if(snapshot(hand(),state.step).street!=='Preflop'&&state.config.postflopModel==='range')return `<details class="panel response-panel"><summary>How range-conditioned EV works</summary><p>For each legal opponent combination h, its reach probability w(h) is multiplied by its fold, call or raise frequency for the tested size. P(call) = Σ w(h) × P(call | h, size). The calling range is normalized by P(call).</p><p>Each branch uses its own opponent range and future-card samples. EV = Σ branch probability × conditional net payoff. Prior contributions are sunk; net payoffs include new investments, refunds and the selected rake estimate.</p><p>The automatic Hero betting range narrows its made-hand value region for larger sizes and adds an adjustable bluff component. You can instead use your edited betting mix. Opponent decisions use their own cards and that public range, never your actual hole cards. Checks preserve strong hands; observed postflop calls use a size-aware, bounded likelihood approximation.</p><p>Policies are uncalibrated assumptions, not GTO or measured pool play. There is one further raise (approximately 3×, bounded by legal limits); Hero responds to its entire range, then both players check down. Future-street bets and a full equilibrium are not modeled. Small EV differences can be sampling noise.</p></details>`;const pre=snapshot(hand(),state.step).street==='Preflop';if(pre&&state.config.preflopModel==='cash')return `<details class="panel response-panel"><summary>About the cash baseline <span class="tag amber">Assumed</span></summary><p>Unknown players begin with all legal starting hands. Position and observed actions narrow each range. Larger wagers and greater stack commitment raise the strength needed to continue.</p><p>The response policy uses an explicit hand-strength ordering and smooth thresholds. Neutral, tighter and looser settings are scenarios, not measured NL10 statistics. Rake remains the editable estimate below.</p><p>Hero can fold or call one further raise; remaining players respond before checkdown. There is no full postflop strategy or automatic player-policy fitting. This is not a GTO solver.</p><p>A GTO benchmark requires a verified solution matching table size, stacks, bet sizes and rake. <a href="https://blog.gtowizard.com/introducing-multiway-preflop-solving/" target="_blank" rel="noopener noreferrer">About those solver inputs</a>.</p></details>`;return `<details class="panel response-panel"><summary>Opponent response model <span class="tag amber">Assumed</span></summary><p class="small-note">${pre?'Preflop: how often does each starting-hand bucket fold, call or raise? These shared rates apply to every opponent; their individual ranges determine the mix. When checking is free, fold weight becomes check; raise weight models a raise behind.':'Facing your bet, how often does each hand bucket fold, call or raise?'} Rows are normalized automatically. This also controls the optional future river response; it does not change the fixed likelihoods used to replay past actions.</p><table class="response-table"><thead><tr><th>Holding</th><th>Fold</th><th>Call</th><th>Raise</th></tr></thead><tbody>${Object.entries(state.config.response).map(([k,v])=>`<tr><th>${(pre?{strong:'Premium / broadway',made:'Pairs / aces / high cards',draw:'Suited connectors',air:'Other'}:{strong:'Strong made',made:'Pair / made',draw:'Draw',air:'Other'})[k]}</th>${v.map((n,i)=>`<td><input class="response-input" data-bucket="${k}" data-col="${i}" type="number" min="0" max="100" value="${n}" aria-label="${k} ${['fold','call','raise'][i]} weight"></td>`).join('')}</tr>`).join('')}</tbody></table><p class="small-note">Buckets are coarse hand features. They do not establish whether a bet is value or a bluff against a particular range.</p></details>`;}
function memoryView(h){
 const records=memory(state.hands,state.memoryAll?null:h);
 return `<section class="panel memory-panel"><div class="section-title"><div><h2>Player observations</h2><p class="small-note">Frequencies from completed hands, with every opportunity counted. Unfinished live hands are excluded.</p></div><label class="check-label"><input type="checkbox" id="memory-all" ${state.memoryAll?'checked':''}> Include later hands</label></div><div class="memory-scope">${state.memoryAll?'Full imported session — includes information unavailable at the selected hand.':'Only hands before #'+esc(h.id)+'. No later results are used.'}</div><div class="table-scroll"><table class="memory-table"><thead><tr><th>Player</th><th>Hands</th><th>VPIP</th><th>PFR</th><th>3-bet</th><th>Flop c-bet</th><th>Fold to c-bet</th><th>Recorded net</th></tr></thead><tbody>${records.map(p=>`<tr><th><button class="text-button" data-action="player-detail" data-value="${esc(p.key)}">${esc(p.name)}</button>${p.hero?'<small>Hero · source-specific</small>':''}</th><td>${p.hands}</td>${[[p.vpip,p.hands],[p.pfr,p.hands],[p.threeBet,p.threeBetOpp],[p.cbet,p.cbetOpp],[p.foldCbet,p.foldCbetOpp]].map(([a,b])=>`<td><b>${b?pct(a/b):'—'}</b><small>${a} / ${b}</small></td>`).join('')}<td class="${p.net>=0?'positive':'negative'}">${signed(p.net/100)}</td></tr>`).join('')||'<tr><td colspan="8">No earlier imported hands. Step to a later hand or include the full session.</td></tr>'}</tbody></table></div><p class="small-note">Small samples describe observations; they do not establish a player's true strategy. No precise hand-dependent policy is automatically fitted from these rates. Preflop straddles are forced contributions and are excluded from VPIP.</p>${records.filter(p=>p.key===state.expandedPlayer).map(p=>`<div class="showdown-memory"><h3>${esc(p.name)} · revealed holdings</h3>${p.shows.map(x=>`<button class="showdown-row" data-action="select-hand" data-id="${esc(x.hand)}"><span class="mini-cards">${x.cards.map(c=>card(c,true)).join('')}</span><span><b>#${esc(x.hand)}</b><small>${esc(x.line)}</small></span><span>Review →</span></button>`).join('')||'<p>No revealed holdings in this memory window.</p>'}<p class="small-note">Shown cards are a selected sample of hands, not the player's entire range.</p></div>`).join('')}</section>`;
}


function ensureLiveEntry(h){
 const key=h.id+':'+h.live.commands.length;
 if(state.liveEntry?.key!==key){state.liveEntry={key,board:[],shown:Object.create(null),winners:Object.create(null),fee:'0.00',amount:'',showHero:false};state.cardTarget=h.live.phase==='board'?'board':h.live.phase==='settle'?'show':null;}
 return state.liveEntry;
}
function captureLiveEntry(el){
 const h=hand();if(!h.live)return;const entry=ensureLiveEntry(h),id=el.id;
 if(id==='live-board')entry.board=looseCards(el.value);
 else if(id==='live-amount')entry.amount=el.value;
 else if(id==='live-fee')entry.fee=el.value;
 else if(id.startsWith('live-winner-'))entry.winners[id.slice(12)]=el.checked;
 else if(id.startsWith('live-show-')){const p=h.players.find(p=>p.seat===Number(id.slice(10)));if(p?.name===h.hero)entry.showHero=el.checked;else if(p)entry.shown[p.name]=looseCards(el.value);}
}
function assignLiveProfile(key){
 if(!state.liveSetup)return;
 const d=state.liveDraft,p=d.players[state.liveSeat-1];
 if(!key){p.memoryKey='';return;}
 const profile=playerCatalog(state.hands).find(x=>x.key===key);if(!profile)throw Error('Choose a player from the imported/session list.');
 if(d.players.slice(0,Number(d.count)).some((x,i)=>i!==state.liveSeat-1&&x.memoryKey===key))throw Error('That player is already seated. Choose a different profile.');
 const base=profile.name.slice(0,26),otherNames=d.players.slice(0,Number(d.count)).filter((_,i)=>i!==state.liveSeat-1).map(x=>x.name);let name=base,n=2;while(otherNames.includes(name))name=base+' '+n++;
 p.name=name;p.memoryKey=key;
}
function handleVisualAction(action,value){
 if(action==='live-seat'){state.liveSeat=Number(value);if(!state.liveSetup){const h=hand();ensureLiveEntry(h);state.cardTarget=h.live.phase==='settle'?'show':null;}render();return true;}
 if(action==='live-set-hero'){state.liveDraft.hero=Number(value);state.liveSeat=Number(value);render();return true;}
 if(action==='live-target-board'){const h=hand();if(!state.liveSetup&&h.live?.phase==='board'){ensureLiveEntry(h);state.cardTarget='board';render();}return true;}
 if(action==='live-size'){
  const h=hand(),entry=ensureLiveEntry(h),s=snapshot(h,h.events.length),p=s.players.find(p=>p.name===h.live.actor);if(!p||!h.live.canRaise)return true;
  const to=value.startsWith('to-')?Number(value.slice(3)):value==='min'?h.live.minTo:p.streetContribution+h.live.toCall+Math.round((s.pot+h.live.toCall)*(value==='half'?.5:1));entry.amount=(Math.min(h.live.maxTo,Math.max(h.live.minTo,to))/100).toFixed(2);render();return true;
 }
 if(action!=='live-card'&&action!=='live-clear-cards')return false;
 let cards,used=[],count,save;
 if(state.liveSetup){const d=state.liveDraft;if(state.liveSeat!==Number(d.hero))throw Error('Select your seat to enter your cards.');cards=looseCards(d.cards);count=2;save=c=>{d.cards=c.join(' ');};}
 else {
  const h=hand(),entry=ensureLiveEntry(h),s=snapshot(h,h.events.length),p=s.players[state.liveSeat-1];
  used=[...h.players.find(p=>p.name===h.hero).cards,...s.board];
  if(state.cardTarget==='board'&&h.live.phase==='board'){cards=entry.board;count=s.board.length?1:3;used.push(...Object.values(entry.shown).flat());save=c=>{entry.board=c;};}
  else if(state.cardTarget==='show'&&h.live.phase==='settle'&&!p.folded&&p.name!==h.hero){cards=entry.shown[p.name]||[];count=2;for(const [name,cs] of Object.entries(entry.shown))if(name!==p.name)used.push(...cs);save=c=>{entry.shown[p.name]=c;};}
  else throw Error('Select the board when ready, or a player at showdown.');
 }
 if(action==='live-clear-cards'){save([]);render();return true;}
 if(cards.includes(value))save(cards.filter(c=>c!==value));
 else {if(used.includes(value))throw Error('That card is already in use.');if(cards.length>=count)throw Error('Remove a selected card before choosing another.');if(!/^[AKQJT2-9][shdc]$/.test(value))throw Error('Choose a card from the deck.');save([...cards,value]);}
 render();return true;
}

function captureLiveDraft(el){
 const key=el.id.slice(5),d=state.liveDraft;
 if(key.startsWith('name-'))d.players[Number(key.slice(5))].name=el.value;
 else if(key.startsWith('stack-'))d.players[Number(key.slice(6))].stack=stackInputDollars(el.value,d.bb);
 else d[key]=el.value;
 if(key==='count'){d.hero=Math.min(Number(d.hero),Number(d.count));d.button=Math.min(Number(d.button),Number(d.count));state.liveSeat=Math.min(state.liveSeat,Number(d.count));}
 if(['count','hero','button','cards'].includes(key)){if(key==='hero')state.liveSeat=Number(d.hero);render();}
}
function liveCents(value,message='Enter a dollar amount with at most two decimal places.'){const n=Number(value),c=Math.round(n*100);if(String(value).trim()===''||!Number.isFinite(n)||Math.abs(n*100-c)>1e-6)throw Error(message);return c;}
function handleLive(action,value){
 try{
  if(action==='live-new'||action==='live-next'){const previous=action==='live-next'?hand():null;if(previous){const existing=state.hands.find(h=>h.live?.spec.sessionId===previous.live.spec.sessionId&&h.live.spec.handNumber===previous.live.spec.handNumber+1);if(existing){chooseHand(existing.id);return;}}state.liveDraft=defaultLiveSetup(previous);state.liveDraft.memoryStart=previous?completeMemory(previous,state.hands):freshMemory();state.liveSeat=Number(state.liveDraft.hero);state.liveSetup=true;state.notice='';render();return;}
  if(action==='live-cancel'){state.liveSetup=false;state.notice='';render();return;}
  if(handleVisualAction(action,value))return;
  if(action==='live-start'){
   const d=state.liveDraft,h=createLiveHand({players:d.players.slice(0,Number(d.count)).map(p=>({name:p.name,stack:liveCents(p.stack,'Enter a stack in BB that equals whole cents at these stakes.'),memoryKey:p.memoryKey})),heroSeat:Number(d.hero),button:Number(d.button),sb:liveCents(d.sb),bb:liveCents(d.bb),cards:d.cards,sessionId:d.sessionId||undefined,handNumber:d.handNumber});
   h.memoryStart=d.memoryStart||freshMemory();state.hands.unshift(h);state.filter='all';state.search='';state.notice='Live hand started. Export a project to save progress; closing this tab does not save it.';chooseHand(h.id);return;
  }
  const h=hand();if(h.practice)throw Error('Use the practice table to play this hand.');if(!h.live)throw Error('Start or select a live hand first.');
  if(action==='live-tip'||action==='live-analyze'){if(state.step!==h.events.length){state.step=h.events.length;nodeSetup();}state.view=action==='live-analyze'?'ranges':'live';render();return;}
  let updated;
  if(action==='live-undo'){if(state.hands.some(x=>x.live?.spec.sessionId===h.live.spec.sessionId&&x.live.spec.handNumber>h.live.spec.handNumber))throw Error('This hand has a later hand. Continue the latest hand to keep carried stacks consistent.');updated=undoLiveAction(h);}
  else if(action==='live-act')updated=appendLiveAction(h,{kind:value,actor:h.live.actor,...(value==='bet'?{to:liveCents(document.getElementById('live-amount').value??ensureLiveEntry(h).amount)}:{})});
  else if(action==='live-board')updated=appendLiveAction(h,{kind:'board',cards:document.getElementById('live-board').value??ensureLiveEntry(h).board.join(' ')});
  else if(action==='live-finish'||action==='live-auto-finish'){
   const s=snapshot(h,h.events.length),shown=structuredClone(ensureLiveEntry(h).shown),winners=livePots(h).map((pot,i)=>pot.eligible.filter(name=>(document.getElementById('live-winner-'+i+'-'+s.players.find(p=>p.name===name).seat).checked??ensureLiveEntry(h).winners[i+'-'+s.players.find(p=>p.name===name).seat])));
   for(const p of s.players.filter(p=>!p.folded)){const el=document.getElementById('live-show-'+p.seat);if(el){if(p.name===h.hero){if(el.checked??ensureLiveEntry(h).showHero)shown[p.name]=p.cards;}else if(el.value?.trim())shown[p.name]=el.value;}}
   updated=appendLiveAction(h,{kind:'settle',fee:liveCents(document.getElementById('live-fee').value??ensureLiveEntry(h).fee),shown,winners,auto:action==='live-auto-finish'});
  }else return;
  state.hands[state.hands.findIndex(x=>x.id===h.id)]=updated;state.liveEntry=null;state.step=updated.events.length;state.view='live';state.notice=updated.live.complete?'Hand saved to this session. Export a project to keep it.':'';nodeSetup();render();

function download(name,content,type='text/plain'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function projectData(){return {format:'range-lab',version:3,playerProfiles:state.playerProfiles,activePlayerId:state.activePlayerId,hands:state.hands.map(h=>h.live?{practice:!!h.practice,memoryStart:h.memoryStart,actionEvidence:h.actionEvidence||{},live:{spec:h.live.spec,commands:h.live.commands}}:{raw:h.raw,source:h.source}),practice:practiceSave(state.practice),handId:state.handId,step:state.step,priors:state.priors,mix:state.mix,config:state.config,line:state.line};}
function exportCompact(){const h=hand();if(!h){toast('Start a hand first.');return;}const p=projectData();p.hands=p.hands.filter(x=>x.live?.spec.id===h.id);if(!h.live){toast('Compact export is available for live tables and practice.');return;}p.hands[0].memoryStart=h.memoryStart||learnMemory(state.hands,h);if(p.practice?.spec.id!==h.id)p.practice=null;p.playerProfiles=p.practice?p.playerProfiles.filter(x=>x.id===p.practice.playerId):[];p.activePlayerId=p.practice?.playerId||'';download('range-lab-session.json',JSON.stringify(p,null,2),'application/json');}

function saveLocal(){if(!state.remember||state.restoring||(!state.hands.length&&!state.playerProfiles.length))return;try{const value=JSON.stringify(projectData());if(value!==savedLocal){globalThis.localStorage.setItem('range-lab-v3',value);savedLocal=value;}}catch{state.remember=false;state.notice='Device saving is unavailable or full. Export a project to keep this session.';}}

async function calculateLearning(beliefsOnly=false){
 const request=++calculationVersion,h=hand(),step=state.step;
 state.loading=true;state.rankProgress='Building beliefs…';if(!beliefsOnly)state.ranking=null;render();
 const cancel=()=>request!==calculationVersion,progress=message=>{if(!cancel()){state.rankProgress=message;render();}};
 try{
  if(!beliefsOnly){const reason=treeAvailability(h,step);if(reason)throw Error(reason);}
  await learnMemoryAsync(state.hands,h,progress,cancel);if(cancel())return;
  if(beliefsOnly){state.beliefNode=nodeBeliefs(state.hands,h,step,state.priors);state.view='learning';}
  else {const config=state.practice?.hand.id===h.id?{...state.config,...state.practice.config}:state.config;const ranking=await analyzeCfr({hands:state.hands,hand:h,step,priors:structuredClone(state.priors),config:structuredClone(config),iterations:state.config.treeSamples,onProgress:progress,cancel});if(cancel())return;state.ranking=ranking;}
  state.notice='';
 }catch(e){if(!cancel())state.notice=e.message;}
 finally{if(!cancel()){state.loading=false;state.rankProgress='';render();}}
}

function adoptPracticePlayer(){

async function calculate(rank=false){
 if(state.config.engine==='belief'){await calculateLearning();return;}
 const request=++calculationVersion,h=hand(),step=state.step;
 state.loading=true;state.rankProgress='';if(rank)state.ranking=null;render();
 try{
  const decision=evDecision(h,step),opponent=rank||decision.preflop?decision.villain.name:state.target;
  const config=structuredClone({...state.config,opponent,heroMix:state.mix}),iterations=config.iterations||5000;
  const ranges=decision.preflop?Object.fromEntries(decision.opponents.map(p=>[p.name,rangeAt(h,step,p.name,structuredClone(weights(p.name)),state.line,false,config)])):undefined;
  const range=ranges?.[opponent]||rangeAt(h,step,opponent,structuredClone(weights(opponent)),state.line,false,config);
  const heroRange=decision.preflop?undefined:rangeAt(h,step,h.hero,structuredClone(weights(h.hero)),state.line,true,config);
  await new Promise(r=>setTimeout(r,20));if(request!==calculationVersion)return;
  const base=analyze({hand:h,step,range,ranges,heroRange,config,iterations});
  if(rank){
   const candidates=actionCandidates({hand:h,step,config}),results=[];
   for(const [order,a] of candidates.entries()){
    if(request!==calculationVersion)return;
    const result=a.line==='aggressive'&&a.betTo!==base.betTo?analyze({hand:h,step,range,ranges,heroRange,config:{...config,betTo:a.betTo},iterations}):base;
    results.push({...a,order,ev:a.line==='fold'?0:result.ev[a.line],routes:a.line==='fold'?[{name:'Hero folds',p:1,payoff:0,contribution:0}]:result.routes[a.line],mix:a.line==='aggressive'?result.mix:null,responseRanges:a.line==='aggressive'?result.responseRanges:null,calledEquity:a.line==='aggressive'?result.calledEquity:null,heroCallRaise:result.heroCallRaise,raiseTo:result.raiseTo});
    state.rankProgress=`Comparing ${order+1} / ${candidates.length}…`;render();
    await new Promise(r=>setTimeout(r,0));
   }
   if(request!==calculationVersion)return;
   state.ranking={...rankActionResults(results),iterations,equity:base.equity,opponent,preflop:base.preflop,opponents:base.opponents,model:base.model};
  }else{state.result=base;state.resultLine=base.canRaise?'aggressive':'passive';}
  state.notice='';
 }catch(e){if(request===calculationVersion)state.notice=e.message;}
 finally{if(request===calculationVersion){state.loading=false;state.rankProgress='';render();}}
}

async function handleKuhn(action,value){
 if(action==='kuhn-open'){state.view='kuhn';render();return;}
 if(action==='kuhn-stop'){kuhnLab.runId++;kuhnLab.running=false;render();return;}
 if(action==='kuhn-export'){download('range-lab-kuhn-results.json',JSON.stringify({game:'Kuhn poker',algorithm:'simultaneous vanilla CFR',units:'net chips per hand; ante 1; no rake',...kuhnLab.result,history:kuhnLab.history.map(({iterations,nashConv,value,improvements})=>({iterations,nashConv,value,improvements}))},null,2),'application/json');return;}
 if(kuhnLab.running)return;
 if(action==='kuhn-reset'){kuhnLab.model=newKuhn();kuhnLab.result=measureKuhn(kuhnLab.model);kuhnLab.history=[kuhnLab.result];kuhnLab.error='';render();return;}
 if(action!=='kuhn-train')return;
 const target=kuhnLab.model.iterations+(Number(value)===1000?1000:10000);kuhnLab.running=true;const run=++kuhnLab.runId;kuhnLab.error='';render();
 try{while(run===kuhnLab.runId&&kuhnLab.running&&kuhnLab.model.iterations<target){
  await new Promise(resolve=>setTimeout(resolve,0));if(run!==kuhnLab.runId||!kuhnLab.running)break;
  trainKuhn(kuhnLab.model,Math.min(100,target-kuhnLab.model.iterations));kuhnLab.result=measureKuhn(kuhnLab.model);kuhnLab.history.push(kuhnLab.result);if(state.view==='kuhn')render();
 }}catch(error){kuhnLab.error='Training stopped. Reset to retry.';console.error(error);}
 finally{if(run===kuhnLab.runId){kuhnLab.running=false;if(state.view==='kuhn')render();}}
}
