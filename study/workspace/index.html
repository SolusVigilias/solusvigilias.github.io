<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study & Research · MirrorVerse</title><meta name="description" content="Seven guided MirrorVerse study modules, checkable exercises, and a browser-local research notebook."><style>
:root{--bg:#f5f4ef;--paper:#fffefb;--ink:#263d37;--dim:#6d7771;--line:#dedfd6;--green:#23654f;--mint:#e6eee3;--orange:#b66d3f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button,a,input,textarea,select{outline-offset:4px}button{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px 15px}button:hover{border-color:var(--green);background:var(--mint)}button.primary{background:var(--green);color:white;border-color:var(--green)}button.active{background:var(--mint);border-color:#99b5a1}header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;border-bottom:1px solid var(--line);background:var(--paper)}.brand{display:flex;gap:12px;align-items:center;font-size:21px;font-weight:650;letter-spacing:-.7px}.mark{font-size:29px;color:var(--green)}.small,.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase}.small{color:var(--dim)}.top-actions{display:flex;gap:10px;align-items:center}.layout{display:grid;grid-template-columns:265px 1fr;min-height:calc(100vh - 78px)}aside{border-right:1px solid var(--line);padding:30px 20px}aside button{display:block;text-align:left;width:100%;margin:5px 0;border-color:transparent;background:transparent;padding:11px 12px}aside .num{display:inline-block;width:28px;color:var(--dim);font:12px ui-monospace,monospace}aside .group{margin:24px 12px 10px}.sidebar-note{padding:18px 12px;font-size:12px;color:var(--dim)}main{max-width:1280px;width:100%;padding:38px 48px 60px;margin:0 auto}h1,h2,h3,p{margin-top:0}h1{font:400 clamp(32px,4vw,49px)/1.12 Georgia,serif;letter-spacing:-1.2px;margin:12px 0 18px}h2{font:400 27px/1.25 Georgia,serif}h3{font-size:16px;line-height:1.4}.muted{color:var(--dim)}.intro{max-width:660px;color:var(--dim);font-size:16px}.hero{position:relative;padding:4px 0 27px;border-bottom:1px solid var(--line);margin-bottom:28px}.hero:after{content:'∼';position:absolute;right:10px;top:5px;font:120px Georgia,serif;color:#ced9cd;z-index:-1}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--paper);border:1px solid var(--line);padding:25px;border-radius:11px}.card p:last-child{margin-bottom:0}.card .eyebrow{color:var(--green);margin-bottom:12px}.span2{grid-column:1/-1}.module-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-height:180px}.module-card h3{margin:8px 0}.module-card button{margin-top:auto}.badge{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:20px;white-space:nowrap}.status{margin-left:auto;color:var(--dim)}.notation{font:17px/1.85 Georgia,serif;white-space:pre-wrap}.prose{max-width:860px}.stack>*+*{margin-top:20px}.steps{display:flex;gap:7px;margin:20px 0;flex-wrap:wrap}.steps span{background:var(--mint);border-radius:20px;font-size:12px;padding:4px 12px}.exercise{border-top:3px solid var(--green)}textarea,input[type=text],select{width:100%;border:1px solid #c9cec5;border-radius:6px;background:white;color:var(--ink);padding:10px 12px}textarea{min-height:130px;resize:vertical}label{display:block;margin:12px 0 5px;font-size:13px;font-weight:550}.choice{display:flex;gap:10px;font-weight:400;padding:10px;border:1px solid var(--line);border-radius:6px;margin:8px 0;align-items:baseline}.choice:has(input:checked){background:var(--mint);border-color:#8aa68e}.feedback{padding:15px 18px;background:var(--mint);border-left:3px solid var(--green);margin-top:16px}.feedback.warn{background:#fbf0df;border-color:var(--orange)}.quiet{font-size:12px;color:var(--dim)}.entry{margin-top:14px;border-top:1px solid var(--line);padding-top:16px}.entry p{white-space:pre-wrap;overflow-wrap:anywhere}.entry .meta{font-size:11px;color:var(--dim)}.entry button{padding:4px 10px;font-size:12px}.empty{padding:25px 0;color:var(--dim);font-size:14px}.notice{padding:14px 18px;border:1px solid #cfd9c9;background:#ecf1e7;border-radius:7px;margin:15px 0;font-size:13px}.session-note{white-space:pre-wrap;overflow-wrap:anywhere}.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 15px}.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;background:var(--ink);color:white;border-radius:7px;max-width:420px;z-index:20}.hide{display:none}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}details summary{cursor:pointer;font-size:14px}footer{margin-top:30px;border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--dim)}@media(max-width:1000px){main{padding:30px 25px}.layout{grid-template-columns:230px 1fr}.top-actions .small{display:none}}@media(max-width:900px){header{padding:0 18px;height:auto;min-height:78px;flex-wrap:wrap;gap:10px;padding-top:12px;padding-bottom:12px}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:10px;display:flex;overflow:auto;gap:5px}aside button{min-width:max-content;width:auto;margin:0}aside .group,aside .sidebar-note,aside .num{display:none}main{padding:25px 18px}.grid{grid-template-columns:1fr}.span2{grid-column:auto}.hero:after{display:none}.card{padding:20px}.top-actions button{font-size:12px;padding:7px 10px}h1{font-size:37px}.brand{font-size:19px}}
</style></head><body><header><div class="brand"><span class="mark">◈</span> MirrorVerse <span class="small">Research workspace</span></div><div class="top-actions"><a href="/study/" style="color:var(--green);font-size:13px">← Study &amp; Research</a><span id="saveStatus" class="small" role="status">Saved on this browser</span><button id="export">Export notebook ↗</button><button id="import">Import</button><input type="file" id="importFile" accept="application/json" hidden></div></header><div class="layout"><aside id="nav" aria-label="Workspace navigation"></aside><main id="main"></main></div><div id="toast" role="status" class="toast hide"></div>
<script>
const MODULES=[{"title": "Compression sufficiency", "tag": "Preserve what the task needs", "notation": "H ∈ ℋ is the observable history; Y ∈ 𝒴 is the target; Z = φ(H) ∈ 𝒵, with φ measurable. On standard Borel spaces, predictive sufficiency means P(Y ∈ B | H) = K(φ(H), B) almost surely, for every measurable B ⊆ 𝒴, for a probability kernel K. Equivalently, Y ⟂ H | Z. Sufficiency is relative to the target and data-generating law.", "intuition": "A compressed history is adequate when knowing the original history cannot improve the conditional law of the chosen target. A poorly fitted predictor and an insufficient encoding are different failures.", "example": "Let H be uniform on {a,b,c,d} and Y ∈ {0,1}. Let P(Y=1 | H) be (0.2, 0.2, 0.8, 0.8). The map φ(a)=φ(b)=0 and φ(c)=φ(d)=1 is sufficient: K(0,{1})=0.2 and K(1,{1})=0.8. Merging a and c would force different laws into one state, so no exact decoder could repair it.", "exercise": "Keep these four conditional probabilities. Instead group {a,c} and {b,d}. Is the encoding sufficient for Y?", "options": ["No: each class contains different conditional laws.", "Yes: both classes have average probability 0.5.", "Unknown: the four laws are not specified."], "correct": 0, "feedback": "Each group mixes probabilities 0.2 and 0.8. Its average is 0.5, but the original history still changes the law. Equal group averages do not establish sufficiency."}, {"title": "Sufficient-state representations", "tag": "Predict and update recursively", "notation": "Hₜ = (O₀,…,Oₜ); Zₜ = φₜ(Hₜ). Require both P(Oₜ₊₁ ∈ B | Hₜ) = Kₜ(Zₜ,B) a.s. and φₜ₊₁(Hₜ ⊕ o) = Uₜ(φₜ(Hₜ),o) on admissible extensions. The updater consumes the realized observation; Kₜ predicts a distribution. Time dependence is allowed.", "intuition": "A usable state must retain predictive information and remain maintainable as observations arrive. A feature that repairs one prediction may still lack a closed recursive update.", "example": "Suppose a binary process obeys P(Oₜ₊₁=1 | Hₜ)=0.1+0.3 Oₜ₋₁+0.4 Oₜ for t≥1. Set Zₜ=(Oₜ₋₁,Oₜ). For Zₜ=(1,0), the probability is 0.4. After observing 1, U((1,0),1)=(0,1); the next prediction is 0.5. Keeping only Oₜ fails when Oₜ₋₁ varies.", "exercise": "From Zₜ=(1,1), observe Oₜ₊₁=0. What is Zₜ₊₁ and then P(Oₜ₊₂=1 | Zₜ₊₁)?", "options": ["(0,1), then 0.5", "(1,0), then 0.4", "(1,1), then 0.8"], "correct": 1, "feedback": "Shift the pair and append the observation: (1,1) → (1,0). The prediction is 0.1+0.3×1+0.4×0=0.4. Prediction and realized updating are separate operations."}, {"title": "Operator sequences", "tag": "Make order and domains explicit", "notation": "For spaces X₀,…,Xₙ and maps Tᵢ:Xᵢ₋₁→Xᵢ, the sequence acts as xₙ=(Tₙ∘⋯∘T₁)(x₀). Composition is evaluated right to left. For linear endomorphisms A,B of the same vector space, [A,B]=AB−BA measures failure to commute.", "intuition": "The effect of a chain depends on its order and the objects each operator accepts. Swapping two steps requires a reason, such as commutation.", "example": "On ℝ², let A(x,y)=(x+y,y) and B(x,y)=(x,2y). At v=(1,1), Bv=(1,2), then ABv=(3,2). Conversely Av=(2,1), then BAv=(2,2). Thus [A,B]v=(1,0) and the orders differ.", "exercise": "For v=(0,2) with the same A and B, compute ABv and BAv.", "options": ["ABv=(2,4); BAv=(4,4)", "ABv=(4,4); BAv=(4,4)", "ABv=(4,4); BAv=(2,4)"], "correct": 2, "feedback": "B first gives (0,4), then A gives (4,4). A first gives (2,2), then B gives (2,4). The commutator applied to v is (2,0)."}, {"title": "Equivalence classes", "tag": "Identify objects by a declared criterion", "notation": "An equivalence relation ∼ on X is reflexive, symmetric and transitive. [x]={y∈X:y∼x}; X/∼ is the quotient. A map f:X→Y descends to f̄:X/∼→Y exactly when x∼y ⇒ f(x)=f(y). For a state update T, require x∼y ⇒ T(x)∼T(y) to induce an update on classes.", "intuition": "A quotient discards distinctions deliberately. Any operation performed on classes must be independent of which representative you choose.", "example": "On ℤ, let x∼y iff x−y is even. There are two classes: even and odd. T(x)=x+1 swaps them and is well-defined on the quotient. But f(x)=x² as a real-valued output does not descend: 0∼2 while f(0)=0 and f(2)=4.", "exercise": "On the parity quotient, does T(x)=3x+1 induce a well-defined update, and what does it do?", "options": ["Yes; it swaps even and odd.", "Yes; it preserves both classes.", "No; representatives always have different integer outputs."], "correct": 0, "feedback": "If x−y is even, T(x)−T(y)=3(x−y) is even. Hence the output class is representative-independent. Even inputs give odd outputs; odd inputs give even outputs."}, {"title": "Phase alignment", "tag": "Choose a convention before comparing", "notation": "Working model: complex phase alignment. Let a,b ∈ ℂⁿ be nonzero, with ⟨a,b⟩=a* b. Choose α∈ℂ, |α|=1, minimizing ‖a−αb‖². If c=a*b≠0, α=conj(c)/|c|. If c=0, every phase is equally optimal. Phase is defined modulo 2π. Other meanings of “phase” remain unspecified.", "intuition": "Representatives that differ by a global phase may describe the same class. Alignment fixes a comparison convention; it does not establish a broader physical equivalence without assumptions.", "example": "Let a=(1,0) and b=(i,0). Then c=i and α=−i. Thus αb=(1,0)=a, reducing the distance to zero. For a=(1,0), b=(0,1), c=0 and no phase is preferred; the distance remains √2.", "exercise": "Let a=(1,0) and b=(−1,0). Which α minimizes the distance?", "options": ["α=1", "α=−1", "Every unit phase is optimal"], "correct": 1, "feedback": "c=−1, so α=conj(c)/|c|=−1. Then αb=a. Nonuniqueness occurs when c=0, not when c is negative."}, {"title": "Parallel transport", "tag": "Compare vectors at different points", "notation": "Let M be a smooth manifold with connection ∇ and γ:[0,1]→M a smooth path. Parallel transport Pγ:Tγ(0)M→Tγ(1)M sends v to V(1), where ∇γ̇V=0 and V(0)=v. In coordinates: dVⁱ/dt + Γⁱⱼₖ(γ(t)) γ̇ʲ Vᵏ=0. A metric-compatible connection preserves inner products along the path; a general connection need not.", "intuition": "Vectors at different points live in different tangent spaces. A connection supplies the comparison rule. Path independence is an additional property, not part of the definition.", "example": "On ℝ² with its Euclidean connection in Cartesian coordinates, Γ=0. Along γ(t)=(t,t²), parallel transport solves dV/dt=0. Starting at v=(2,−1), V(t)=(2,−1) in Cartesian components, even though the path bends.", "exercise": "With the same Euclidean connection, transport v=(3,4) along γ(t)=(cos t,sin t), 0≤t≤1. What are the endpoint Cartesian components and norm?", "options": ["(3 cos 1,4 sin 1), norm depends on t", "Unknown because the path is curved", "(3,4), norm 5"], "correct": 2, "feedback": "The Cartesian connection coefficients vanish. Components stay (3,4) and the Euclidean norm is √(9+16)=5. Components in a moving frame could change even for a parallel vector."}, {"title": "State–metric co-updates", "tag": "Track the state and its measuring rule", "notation": "Working model on ℝᵈ: xₜ∈ℝᵈ, Gₜ∈Sym⁺⁺(d). Define xₜ₊₁=F(xₜ,Gₜ,oₜ₊₁) and Gₜ₊₁=Ψ(xₜ,Gₜ,oₜ₊₁). The norm at step t is ‖v‖²Gₜ=vᵀGₜv. A coordinate change x′=Ax, A invertible, requires G′=A⁻ᵀGA⁻¹ to preserve lengths. A learned metric update is a different operation and requires its own rule.", "intuition": "When both the state and the rule for measuring it evolve, apparent change can come from either. Specify update order, positivity and the comparison convention before interpreting change.", "example": "Illustrative simultaneous rule: xₜ₊₁=xₜ+Gₜ⁻¹u; Gₜ₊₁=(1−η)Gₜ+ηI with 0≤η≤1. At xₜ=(0,0), Gₜ=diag(4,1), u=(4,1), η=1/2, we get xₜ₊₁=(1,1) and Gₜ₊₁=diag(2.5,1). Its squared norm is 3.5 under the new metric, but 5 under the old one. This is a declared toy model, not a confirmed MirrorVerse law.", "exercise": "Using that rule, let xₜ=(0,0), Gₜ=diag(2,2), u=(2,0), η=1. Find xₜ₊₁ and Gₜ₊₁.", "options": ["xₜ₊₁=(1,0), Gₜ₊₁=I", "xₜ₊₁=(2,0), Gₜ₊₁=I", "xₜ₊₁=(1,0), Gₜ₊₁=2I"], "correct": 0, "feedback": "The state uses the old metric: Gₜ⁻¹u=(1,0). The metric becomes I when η=1. Updating the metric first and then using it for the state would define a different rule."}];
const KEY='mirrorverse-study-v1';
const blank=()=>({version:1,answers:{},progress:{},log:[],sessions:[],draftSession:{module:0,note:'',next:''}});
let state=blank(),view='home',storageOK=true;
try {const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!valid(parsed))throw Error('Invalid saved format');state=parsed}}catch(e){storageOK=false}
function valid(s){return s&&s.version===1&&s.answers&&typeof s.answers==='object'&&!Array.isArray(s.answers)&&Object.values(s.answers).every(a=>a&&typeof a==='object'&&['response','notes','feedback'].every(k=>a[k]===undefined||typeof a[k]==='string')&&(a.choice===undefined||[0,1,2].includes(a.choice))&&['checked','revealed'].every(k=>a[k]===undefined||typeof a[k]==='boolean'))&&s.progress&&typeof s.progress==='object'&&Object.values(s.progress).every(x=>['Not reported','Studying','Understood','Revisit'].includes(x))&&Array.isArray(s.log)&&s.log.every(e=>e&&typeof e.id==='string'&&['commitment','question','hypothesis','next'].includes(e.category)&&['text','source','date'].every(k=>typeof e[k]==='string'))&&Array.isArray(s.sessions)&&s.sessions.every(e=>e&&Number.isInteger(e.module)&&e.module>=0&&e.module<7&&['id','note','next','date'].every(k=>typeof e[k]==='string'))&&s.draftSession&&Number.isInteger(s.draftSession.module)&&s.draftSession.module>=0&&s.draftSession.module<7&&typeof s.draftSession.note==='string'&&typeof s.draftSession.next==='string'}
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;$('saveStatus').textContent='Saved on this browser'}catch(e){storageOK=false;$('saveStatus').textContent='Not saved — export a backup';toast('Browser storage unavailable. Export to keep your work.')}}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hide');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hide'),4500)}
const stamp=d=>new Date(d).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
const status=i=>state.progress[i]||'Not reported';
function go(v){view=v;render();window.scrollTo(0,0)}
function nav(){ $('nav').innerHTML=`<button data-view="home" class="${view==='home'?'active':''}">⌂ &nbsp; Workspace</button><div class="group small">Guided study · 7 modules</div>${MODULES.map((m,i)=>`<button data-view="${i}" class="${view===i?'active':''}"><span class="num">0${i+1}</span>${esc(m.title)}</button>`).join('')}<div class="group small">Your research</div><button data-view="log" class="${view==='log'?'active':''}">☷ &nbsp; Research log</button><button data-view="sessions" class="${view==='sessions'?'active':''}">◷ &nbsp; Session history</button><div class="sidebar-note">General framework first.<br>Unknowns stay unknown.<br>Progress is yours to report.</div>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(/^\d+$/.test(b.dataset.view)?+b.dataset.view:b.dataset.view));}
function footer(){return `<footer>Personal notebook · Data stays in this browser; it is not synced across devices. Export regularly to keep a portable backup. Teaching examples are illustrative; they are not research commitments.</footer>`}
function render(){nav();if(view==='home')home();else if(view==='log')logView();else if(view==='sessions')sessionsView();else moduleView(view);if(!storageOK)$('saveStatus').textContent='Storage unavailable — export backup'}
function home(){const last=state.sessions.at(-1);$('main').innerHTML=`<div class="hero"><div class="eyebrow">A place to think, test & return</div><h1>Structure your inquiry.<br>Keep the unknowns visible.</h1><p class="intro">A reusable study notebook for representations, transformations and evolving geometry. Start with the general objects. Make each assumption explicit.</p></div><div class="grid"><section class="card"><div class="eyebrow">Latest reported session</div><h2>${last?esc(MODULES[last.module].title):'Your starting point is open.'}</h2><p class="session-note">${last?esc(last.note):'No session has been recorded. Prior understanding, completed exercises and current progress are unknown.'}</p>${last?`<p class="quiet">Recorded ${esc(stamp(last.date))}</p><p><strong>Reported next step:</strong> ${esc(last.next||'Unknown / not reported')}</p>`:''}<button class="primary" id="resume">${last?'Revisit this session →':'Choose a starting module ↓'}</button></section><section class="card"><div class="eyebrow">Notebook principles</div><h2>Separate evidence from possibility.</h2><p>Documented commitments require a source or explicit decision. Open questions, tentative hypotheses and next steps have their own places.</p><p class="quiet">Reading, saving an answer or passing a check never changes your reported progress.</p><button id="openLog">Open research log →</button></section></div><div class="section-title" id="modules"><h2 style="margin:0">The study framework</h2><span class="small">${Object.values(state.progress).filter(x=>x==='Understood').length} / 7 self-reported understood</span></div><div class="grid">${MODULES.map((m,i)=>`<section class="card module-card"><div class="row" style="width:100%"><span class="eyebrow">Module 0${i+1}</span><span class="badge status">${esc(status(i))}</span></div><h3>${esc(m.title)}</h3><p class="muted">${esc(m.tag)}</p><button data-module="${i}">Explore module →</button></section>`).join('')}</div>${footer()}`;$('resume').onclick=()=>last?go(last.module):$('modules').scrollIntoView({behavior:'smooth'});$('openLog').onclick=()=>go('log');document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>go(+b.dataset.module))}
function moduleView(i){const m=MODULES[i],a=state.answers[i]||{};$('main').innerHTML=`<div class="hero"><div class="eyebrow">Guided study / Module 0${i+1}</div><h1>${esc(m.title)}</h1><p class="intro">${esc(m.tag)}</p><div class="row"><label for="progress">My reported status</label><select id="progress" style="width:auto">${['Not reported','Studying','Understood','Revisit'].map(x=>`<option ${status(i)===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="steps"><span>01 · Formal frame</span><span>02 · Intuition</span><span>03 · Worked example</span><span>04 · Check & reflect</span></div><div class="stack prose"><section class="card"><div class="eyebrow">01 / Objects, assumptions & notation</div><p class="notation">${esc(m.notation)}</p></section><section class="card"><div class="eyebrow">02 / Compact intuition</div><p>${esc(m.intuition)}</p></section><section class="card"><div class="eyebrow">03 / Worked example</div><p>${esc(m.example)}</p></section><section class="card exercise"><div class="eyebrow">04 / Checkable exercise</div><h3>${esc(m.exercise)}</h3><label for="response">My reasoning / response</label><textarea id="response" placeholder="State assumptions, show the steps, note what remains unclear…">${esc(a.response||'')}</textarea><fieldset style="border:0;padding:0;margin:16px 0"><legend>Select a result to check</legend>${m.options.map((o,j)=>`<label class="choice"><input type="radio" name="choice" value="${j}" ${a.choice===j?'checked':''}>${esc(o)}</label>`).join('')}</fieldset><div class="row"><button class="primary" id="check">Check selected result</button><button id="reveal">Show worked answer</button></div><p class="quiet">This checks your selected result only. Written reasoning is saved for your review and is not automatically graded.</p><div id="feedback" aria-live="polite"></div><label for="notes">My feedback / what I would revise</label><textarea id="notes" placeholder="Compare your derivation with the answer. Record remaining uncertainty…">${esc(a.notes||'')}</textarea></section><section class="card"><div class="eyebrow">Session bookmark</div><p>Record what you actually worked on. This creates a revisitable session without marking the module understood.</p><button id="record">Record a session →</button></section><div class="row between"><button id="prev">${i?'← Previous module':'← Workspace'}</button><button id="next">${i<6?'Next module →':'Research log →'}</button></div></div>${footer()}`;
const get=()=>state.answers[i]||(state.answers[i]={});$('response').oninput=e=>{get().response=e.target.value;save()};$('notes').oninput=e=>{get().notes=e.target.value;save()};$('progress').onchange=e=>{state.progress[i]=e.target.value;save();showFeedback(i);toast('Saved your reported status.');};document.querySelectorAll('[name=choice]').forEach(r=>r.onchange=()=>{get().choice=+r.value;get().checked=false;get().revealed=false;save();showFeedback(i)});$('check').onclick=()=>{if(get().choice===undefined){toast('Select a result first.');return}get().checked=true;save();showFeedback(i)};$('reveal').onclick=()=>{get().revealed=true;save();showFeedback(i)};$('record').onclick=()=>{state.draftSession.module=i;save();go('sessions')};$('prev').onclick=()=>go(i?i-1:'home');$('next').onclick=()=>go(i<6?i+1:'log');showFeedback(i)}
function showFeedback(i){const a=state.answers[i]||{},m=MODULES[i];$('feedback').innerHTML=(a.checked||a.revealed)?`<div class="feedback ${a.checked&&a.choice!==m.correct?'warn':''}"><strong>${a.checked?(a.choice===m.correct?'Selected result is correct.':'Selected result needs revision.'):'Worked answer'}</strong><p>${esc(m.feedback)}</p><p class="quiet">Understanding remains ${esc(status(i).toLowerCase())} until you report otherwise.</p></div>`:''}
const cats={commitment:['Documented commitments','Decisions or claims with an explicit source.'],question:['Open questions','Unresolved questions; no answer is presumed.'],hypothesis:['Tentative hypotheses','Proposals awaiting evidence or tests.'],next:['Next steps','Intended actions; not completed work.']};
let logDraft={category:'question',text:'',source:''};
function logView(){ $('main').innerHTML=`<div class="hero"><div class="eyebrow">Research / Evidence & uncertainty</div><h1>The research log</h1><p class="intro">Keep decisions, questions, hypotheses and intended work distinct. Nothing is promoted automatically.</p></div><section class="card"><h2>Add a research entry</h2><label for="category">Entry type</label><select id="category">${Object.entries(cats).map(([k,v])=>`<option value="${k}" ${logDraft.category===k?'selected':''}>${v[0]}</option>`).join('')}</select><label for="entryText">Statement / question</label><textarea id="entryText" placeholder="Record exactly what you know, propose, ask or intend…">${esc(logDraft.text)}</textarea><label for="source">Source / basis / explicit decision</label><input id="source" type="text" value="${esc(logDraft.source)}" placeholder="Required for commitments; otherwise leave blank for unknown"><p class="quiet">A commitment is a documented position, not a guarantee of truth. Include a citation, session reference or explicit personal decision.</p><button id="addEntry" class="primary">Save entry</button></section><div class="grid" style="margin-top:24px">${Object.entries(cats).map(([k,v])=>`<section class="card"><div class="row between"><h2>${v[0]}</h2><span class="badge">${state.log.filter(e=>e.category===k).length}</span></div><p class="quiet">${v[1]}</p>${state.log.filter(e=>e.category===k).reverse().map(e=>`<article class="entry"><p>${esc(e.text)}</p><p class="quiet">Basis: ${esc(e.source||'Unknown / not supplied')}</p><div class="row between"><span class="meta">${esc(stamp(e.date))}</span><button data-delete="${esc(e.id)}">Delete</button></div></article>`).join('')||'<div class="empty">No entries recorded.</div>'}</section>`).join('')}</div>${footer()}`;['category','entryText','source'].forEach(id=>$(id).oninput=()=>{logDraft={category:$('category').value,text:$('entryText').value,source:$('source').value}});$('addEntry').onclick=()=>{const d=logDraft;if(!d.text.trim()){toast('Write a statement or question first.');return}if(d.category==='commitment'&&!d.source.trim()){toast('Add a source or explicit decision for this commitment.');return}state.log.push({id:crypto.randomUUID(),category:d.category,text:d.text.trim(),source:d.source.trim(),date:new Date().toISOString()});logDraft={category:d.category,text:'',source:''};save();logView();toast('Entry recorded without changing its category.')};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry? Export first if you need a permanent copy.')){state.log=state.log.filter(e=>e.id!==b.dataset.delete);save();logView()}})}
function sessionsView(){const d=state.draftSession;$('main').innerHTML=`<div class="hero"><div class="eyebrow">Continuity / User-reported only</div><h1>Return to your thinking.</h1><p class="intro">A visit is not progress. Only sessions you explicitly record appear here. The latest record becomes your workspace bookmark.</p></div><section class="card"><h2>Record this session</h2><label for="sessionModule">Module</label><select id="sessionModule">${MODULES.map((m,i)=>`<option value="${i}" ${d.module===i?'selected':''}>${esc(m.title)}</option>`).join('')}</select><label for="sessionNote">What I actually worked on / where I stopped</label><textarea id="sessionNote" placeholder="Report your work in your own words…">${esc(d.note)}</textarea><label for="sessionNext">Next step (optional)</label><input type="text" id="sessionNext" value="${esc(d.next)}" placeholder="Leave blank if unknown"><div class="toolbar"><button class="primary" id="saveSession">Record session</button></div><p class="quiet">Drafts save locally. Only “Record session” adds a session to history.</p></section><div class="section-title"><h2>Recorded sessions</h2><span class="small">${state.sessions.length} records</span></div><div class="stack">${[...state.sessions].reverse().map(s=>`<section class="card"><div class="eyebrow">${esc(stamp(s.date))}</div><h3>${esc(MODULES[s.module].title)}</h3><p class="session-note">${esc(s.note)}</p><p class="session-note"><strong>Next step:</strong> ${esc(s.next||'Unknown / not reported')}</p><div class="row"><button data-revisit="${s.module}">Revisit module →</button><button data-remove-session="${esc(s.id)}">Delete record</button></div></section>`).join('')||'<section class="card empty">No sessions reported yet. Your starting point and previous progress remain unknown.</section>'}</div>${footer()}`;const sync=()=>{state.draftSession={module:+$('sessionModule').value,note:$('sessionNote').value,next:$('sessionNext').value};save()};['sessionModule','sessionNote','sessionNext'].forEach(id=>$(id).oninput=sync);$('saveSession').onclick=()=>{sync();if(!state.draftSession.note.trim()){toast('Describe what you actually worked on first.');return}state.sessions.push({...state.draftSession,id:crypto.randomUUID(),date:new Date().toISOString()});state.draftSession={module:state.draftSession.module,note:'',next:''};save();sessionsView();toast('Session recorded. Module status is unchanged.')};document.querySelectorAll('[data-revisit]').forEach(b=>b.onclick=()=>go(+b.dataset.revisit));document.querySelectorAll('[data-remove-session]').forEach(b=>b.onclick=()=>{if(confirm('Delete this session record?')){state.sessions=state.sessions.filter(s=>s.id!==b.dataset.removeSession);save();sessionsView()}})}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mirrorverse-notebook-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Notebook exported. Keep the file as your backup.')};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const s=JSON.parse(await f.text());if(!valid(s))throw Error();if(confirm('Replace this browser’s notebook with the imported notebook? Export first to keep both.')){state=s;save();render();toast('Notebook restored.')}}catch(e){toast('Could not import: expected a valid MirrorVerse notebook JSON file.')}finally{$('importFile').value=''}};
const initialModule=new URLSearchParams(location.search).get("module");
if(initialModule!==null && /^[0-6]$/.test(initialModule)) view=Number(initialModule);
render();
